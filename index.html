
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles/style.css">
    <title>CalcNix</title>
</head>
<body>
    <div class="forms">
        <div class="login">
            <p>E-mail</p>
            <input type="email" name="E-mail" id="inpEm">
            <p>Senha</p>
            <input type="password" name="Senha" id="senha">
            <br>
            <br>
            <button class="enter" id="enter">Entrar</button>
            <a id="btncadas">Não tem conta? Cadastre-se</a>
        </div>

        <div class="pag-secreta">
            <div class="cadastro">
                <p>Nome</p>
                <input type="text" name="Nome" id="nome">
                <p>E-mail</p>
                <input type="email" name="E-mail" id="inpEm">
                <p>Senha</p>
                <input type="password" name="Senha" id="senha">
                <br>
                <br>
                <button class="enter" id="cadastro">Cadastrar</button>
            </div>
        </div>
    </div>
</body>
</html>
